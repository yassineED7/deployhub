version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deployhub-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: deployhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - deployhub-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d deployhub" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: yassineed/deployhub-api:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: deployhub-api
    restart: always
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/deployhub
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deployhub-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: deployhub-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - deployhub-net

networks:
  deployhub-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local